<div class="container-fluid mt-4 equipos-container">

  <div class="equipos-card">

    <!-- Header -->
    <div class="equipos-header">
      <h3>Listado de Ligas</h3>

      <button
        class="btn-add"
        routerLink="/agregar-liga">
        <i class="fa fa-plus"></i>
        Agregar
      </button>
    </div>

    <!-- Tabla -->
    <div class="equipos-table">
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>País</th>
            <th>Temporada Actual</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          @for (liga of ligas; track liga.id) {
            <tr>
              <td>{{ liga.id }}</td>
              <td>{{ liga.nombre }}</td>
              <td>{{ liga.pais }}</td>
              <td>{{ liga.temporadaActual }}</td>

              <!-- Acciones -->
              <td class="equipos-actions">
                <button
                  class="btn-edit"
                  [routerLink]="['/actualizar-liga', liga.id]">
                  <i class="fa fa-edit"></i>
                </button>

                <button
                  class="btn-delete"
                  [routerLink]="['/eliminar-liga', liga.id]">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

  </div>
</div>
