<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm rounded-3 border-0">

        <!-- Header -->
        <div class="card-header bg-primary text-white text-center rounded-top">
          <h5 class="mb-0 fw-semibold">Eliminar Liga</h5>
        </div>

        <!-- Form -->
        <form>
          <div class="card-body px-4 py-3">

            <!-- Nombre -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Nombre</label>
              <input
                type="text"
                class="form-control form-control-sm"
                [(ngModel)]="liga.nombre"
                id="nombre"
                name="nombre"
                aria-describedby="nombreHelp">

              <div id="nombreHelp" class="form-text">
                No debe quedar el campo vacío.
              </div>
            </div>

            <!-- País -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">País</label>
              <input
                type="text"
                class="form-control form-control-sm"
                [(ngModel)]="liga.pais"
                id="pais"
                name="pais">
            </div>

            <!-- Temporada Actual -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Temporada Actual</label>
              <input
                type="text"
                class="form-control form-control-sm"
                [(ngModel)]="liga.temporadaActual"
                id="temporadaActual"
                name="temporadaActual">
            </div>

          </div>

          <!-- Footer -->
          <div class="card-footer bg-light d-flex justify-content-end gap-2 rounded-bottom">
            <button
              type="submit"
              class="btn btn-primary btn-sm px-4"
              (click)="eliminar()">
              Eliminar
            </button>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm px-4"
              routerLink="/ligas">
              Cancelar
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
