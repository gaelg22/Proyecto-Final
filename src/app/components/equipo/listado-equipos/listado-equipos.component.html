<div class="container-fluid mt-4 equipos-container">

  <div class="equipos-card">

    <!-- Header -->
    <div class="equipos-header">
      <h3>Listado de Equipos</h3>

      <button
        class="btn-add"
        routerLink="/agregar-equipo">
        <i class="fa fa-plus"></i>
        Agregar
      </button>
    </div>

    <!-- Tabla -->
    <div class="equipos-table">
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Ciudad</th>
            <th>Liga</th>
            <th>Entrenador</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          @for (equipo of equipos; track equipo.id) {
            <tr>
              <td>{{ equipo.id }}</td>
              <td>{{ equipo.nombre }}</td>
              <td>{{ equipo.ciudad }}</td>
              <td>{{ equipo.ligaId }}</td>
              <td>{{ equipo.entrenadorId }}</td>

              <!-- Acciones -->
              <td class="equipos-actions">
                <button
                  class="btn-edit"
                  [routerLink]="['/actualizar-equipo', equipo.id]">
                  <i class="fa fa-edit"></i>
                </button>

                <button
                  class="btn-delete"
                  [routerLink]="['/eliminar-equipo', equipo.id]">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

  </div>
</div>
