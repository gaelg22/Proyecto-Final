<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm rounded-3 border-0">

        <!-- Header -->
        <div class="card-header bg-primary text-white text-center rounded-top">
          <h5 class="mb-0 fw-semibold">Agregar Equipo</h5>
        </div>

        <!-- Form -->
        <form>
          <div class="card-body px-4 py-3">

            <!-- Nombre -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Nombre</label>
              <input
                type="text"
                class="form-control form-control-sm"
                [(ngModel)]="equipo.nombre"
                id="nombre"
                name="nombre">

              <div id="nombreHelp" class="form-text">
                No debe quedar el campo vacío.
              </div>
            </div>

            <!-- Ciudad -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Ciudad</label>
              <input
                type="text"
                class="form-control form-control-sm"
                [(ngModel)]="equipo.ciudad"
                id="ciudad"
                name="ciudad">
            </div>

            <!-- Liga -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Id Liga</label>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="equipo.ligaId"
                id="ligaId"
                name="ligaId">
            </div>

            <!-- Entrenador -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Id Entrenador</label>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="equipo.entrenadorId"
                id="entrenadorId"
                name="entrenadorId">
            </div>

          </div>

          <!-- Footer -->
          <div class="card-footer bg-light d-flex justify-content-end gap-2 rounded-bottom">
            <button
              type="button"
              class="btn btn-primary btn-sm px-4"
              (click)="guardar()">
              Guardar
            </button>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm px-4"
              routerLink="/entrenadores">
              Cancelar
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
