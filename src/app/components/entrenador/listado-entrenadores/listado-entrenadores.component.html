<div class="container-fluid mt-4 entrenadores-container">

  <div class="entrenadores-card">

    <!-- Header -->
    <div class="entrenadores-header">
      <h3>Listado de Entrenadores</h3>

      <button
        class="btn-add"
        routerLink="/agregar-entrenador">
        <i class="fa fa-plus"></i>
        Agregar
      </button>
    </div>

    <!-- Tabla -->
    <div class="entrenadores-table">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Experiencia</th>
            <th>Nacionalidad</th>
            <th>Equipo</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          @for (entrenador of entrenadores; track entrenador.id) {
            <tr>
              <td>{{ entrenador.id }}</td>
              <td>{{ entrenador.nombre }}</td>
              <td>{{ entrenador.experiencia }}</td>
              <td>{{ entrenador.nacionalidad }}</td>
              <td>{{ entrenador.equipoId }}</td>

              <!-- Acciones -->
              <td class="entrenadores-actions">
                <button
                  class="btn-edit"
                  [routerLink]="['/actualizar-entrenador', entrenador.id]">
                  <i class="fa fa-edit"></i>
                </button>

                <button
                  class="btn-delete"
                  [routerLink]="['/eliminar-entrenador', entrenador.id]">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

  </div>
</div>
