
<div class="container-fluid mt-4">

  <!-- Card -->
  <div class="card">

    <!-- Header -->
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title mb-0">Listado de Entrenadores</h3>

      <button
          class="btn btn-primary btn-sm" 
          routerLink="/agregar-entrenador">
          <i class="fas fa-plus"></i> Agregar
      </button>

    </div>

    <!-- Body -->
    <div class="card-body table-responsive p-0">
      <table class="table table-bordered table-striped text-nowrap">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Experiencia</th>
            <th>Nacionalidad</th>
            <th>Equipo</th>
            <th style="width: 130px">Acciones</th>
          </tr>
        </thead>

        <tbody>
          @for (entrenador of entrenadores; track entrenador.id) {
            <tr>
              <th scope="row">{{ entrenador.id }}</th>
              <td>{{ entrenador.nombre }}</td>
              <td>{{ entrenador.experiencia }}</td>
              <td>{{ entrenador.nacionalidad }}</td>
              <td>{{ entrenador.equipoId }}</td>
              <!-- Acciones -->
              <td class="text-center">
                <button class="btn btn-warning btn-sm me-1"[routerLink]="['/actualizar-entrenador', entrenador.id]">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-danger btn-sm" [routerLink]="['/eliminar-entrenador',entrenador.id]">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

  </div>
</div>
