<div class="container-fluid mt-4 jugadores-container">

  <div class="jugadores-card">

    <!-- Header -->
    <div class="jugadores-header">
      <h3>Listado de Jugadores</h3>

      <button
        class="btn-add"
        routerLink="/agregar-jugador">
        <i class="fa fa-plus"></i>
        Agregar
      </button>
    </div>

    <!-- Tabla -->
    <div class="jugadores-table">
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Posición</th>
            <th>Número</th>
            <th>Equipo</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>
          @for (jugador of jugadores; track jugador.id) {
            <tr>
              <td>{{ jugador.id }}</td>
              <td>{{ jugador.nombre }}</td>
              <td>{{ jugador.pocision }}</td>
              <td>{{ jugador.numero }}</td>
              <td>{{ jugador.equipoId }}</td>

              <!-- Acciones -->
              <td class="jugadores-actions">
                <button
                  class="btn-edit"
                  [routerLink]="['/actualizar-jugador', jugador.id]">
                  <i class="fa fa-edit"></i>
                </button>

                <button
                  class="btn-delete"
                  [routerLink]="['/eliminar-jugador', jugador.id]">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

  </div>
</div>
