<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm rounded-3 border-0">

        <!-- Header -->
        <div class="card-header bg-primary text-white text-center rounded-top">
          <h5 class="mb-0 fw-semibold">Agregar Partido</h5>
        </div>

        <!-- Form -->
        <form>
          <div class="card-body px-4 py-3">

            <!-- Fecha -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Fecha</label>
              <input
                type="date"
                class="form-control form-control-sm"
                [(ngModel)]="partido.fecha"
                id="fecha"
                name="fecha">
            </div>

            <!-- Goles Local -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Goles Local</label>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="partido.golesLocal"
                id="golesLocal"
                name="golesLocal">
            </div>

            <!-- Goles Visitante -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Goles Visitante</label>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="partido.golesVisitante"
                id="golesVisitante"
                name="golesVisitante">
            </div>

            <!-- Id Equipo Local -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Id Equipo Local</label>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="partido.equipoLocalId"
                id="equipoLocalId"
                name="equipoLocalId">
            </div>

            <!-- Id Equipo Visitante -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Id Equipo Visitante</label>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="partido.equipoVisitanteId"
                id="equipoVisitanteId"
                name="equipoVisitanteId">
            </div>

            <!-- Id Liga -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Id Liga</label>
              <input
                type="number"
                class="form-control form-control-sm"
                [(ngModel)]="partido.ligaId"
                id="ligaId"
                name="ligaId">
            </div>

          </div>

          <!-- Footer -->
          <div class="card-footer bg-light d-flex justify-content-end gap-2 rounded-bottom">
            <button
              type="submit"
              class="btn btn-primary btn-sm px-4"
              (click)="guardar()">
              Guardar
            </button>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm px-4"
              routerLink="/entrenadores">
              Cancelar
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
